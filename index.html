 <!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BAIDIGITAL | AI Marketing & Political Campaigns</title>
  <meta name="description" content="AI బిజినెస్ ప్రమోషన్ మరియు పొలిటికల్ డిజిటల్ క్యాంపెయిన్స్ - A to Z సర్వీసెస్.">
  
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#030712">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00d4ff;
      --secondary: #7928ca;
      --accent: #25d366;
      --gold: #fbbf24;
      --bg-dark: #030712;
      --card-bg: #0b1120;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 95px;
      overflow-x: hidden;
    }

    .top-bar {
      background: #070d18;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.78rem;
      flex-wrap: wrap;
      gap: 6px;
    }
    .lang-switcher {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }
    .lang-btn {
      background: transparent;
      border: 1px solid rgba(0, 212, 255, 0.3);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 700;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 7, 18, 0.92);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--card-border);
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: contain;
      background: #000;
      border: 1.5px solid rgba(0, 212, 255, 0.4);
    }
    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00d4ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .menu-toggle-btn {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 2000;
      display: none;
    }
    .menu-drawer {
      position: fixed;
      top: 0;
      right: -280px;
      width: 280px;
      height: 100%;
      background: #090e1a;
      border-left: 1px solid rgba(0, 212, 255, 0.2);
      z-index: 2001;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease;
      overflow-y: auto;
    }
    .menu-drawer.open {
      right: 0;
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }
    .drawer-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
    }
    .drawer-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .drawer-links a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.98rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero {
      padding: 24px 20px 16px;
      text-align: center;
    }
    .hero-tag {
      display: inline-block;
      font-size: 0.78rem;
      background: rgba(0, 212, 255, 0.1);
      color: #00d4ff;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      border: 1px solid rgba(0, 212, 255, 0.25);
      margin-bottom: 12px;
    }
    .hero h1 {
      font-size: 1.85rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 10px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .video-stage {
      max-width: 440px;
      margin: 0 auto 24px;
      padding: 0 10px;
    }
    .video-frame {
      background: #000;
      border-radius: 20px;
      padding: 6px;
      border: 2px solid rgba(0, 212, 255, 0.45);
      box-shadow: 0 12px 35px rgba(0, 212, 255, 0.3), 0 0 20px rgba(168, 85, 247, 0.25);
      overflow: hidden;
    }
    .video-frame video, .video-frame img {
      width: 100%;
      height: auto;
      border-radius: 14px;
      display: block;
      background: #000;
    }

    .tab-container {
      padding: 0 20px;
      margin-bottom: 20px;
    }
    .tab-buttons {
      display: flex;
      background: #0f172a;
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--card-border);
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #fff;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 800;
      text-align: center;
      margin: 32px 0 16px;
      color: #ffffff;
    }

    .pricing-wrap {
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .pricing-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--card-border);
      position: relative;
    }
    .pricing-card.normal {
      border-color: #38bdf8;
      background: linear-gradient(180deg, rgba(14, 165, 233, 0.1) 0%, #0b1120 100%);
    }
    .pricing-card.premium {
      border-color: #a855f7;
      background: linear-gradient(180deg, rgba(168, 85, 247, 0.12) 0%, #0b1120 100%);
    }
    .plan-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #ec4899;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 10px;
    }
    .plan-name {
      font-size: 1.15rem;
      font-weight: 800;
    }
    .plan-price {
      font-size: 1.7rem;
      font-weight: 800;
      color: #38bdf8;
      margin: 8px 0 12px;
    }
    .plan-features {
      list-style: none;
      margin-bottom: 16px;
    }
    .plan-features li {
      font-size: 0.86rem;
      color: #cbd5e1;
      margin-bottom: 7px;
    }
    .plan-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      background: #10b981;
      color: #ffffff;
    }

    .brochure-section {
      margin: 30px 20px;
      background: linear-gradient(145deg, #0b1120, #070d18);
      border: 2px solid #00d4ff;
      border-radius: 20px;
      padding: 24px 18px;
    }
    .brochure-header {
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }
    .brochure-header h3 {
      font-size: 1.3rem;
      color: #00d4ff;
      font-weight: 800;
    }
    .brochure-header p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .brochure-item {
      background: #030712;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .brochure-item h4 {
      color: #38bdf8;
      font-size: 0.95rem;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 5px;
    }
    .brochure-item h4 span {
      color: var(--gold);
    }
    .brochure-item p {
      font-size: 0.82rem;
      color: #cbd5e1;
    }
    .print-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #fff;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 0.92rem;
      margin-top: 14px;
    }

    .founder-card {
      margin: 0 20px 28px;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0b1120 100%);
      border-radius: 20px;
      padding: 20px;
      border: 1.5px solid rgba(251, 191, 36, 0.4);
      text-align: center;
    }
    .founder-badge {
      display: inline-block;
      background: rgba(251, 191, 36, 0.15);
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .founder-video-box {
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(251, 191, 36, 0.35);
      background: #000;
      margin-bottom: 14px;
    }
    .founder-video-box video {
      width: 100%;
      height: auto;
      display: block;
    }

    .timeline-wrap {
      padding: 0 20px;
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
    }
    .timeline-card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .time-icon {
      font-size: 1.8rem;
    }
    .time-details h4 {
      font-size: 0.95rem;
      color: #fff;
    }
    .time-details p {
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 700;
    }

    .hours-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      margin: 0 20px 24px;
    }
    .hours-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.85rem;
    }
    .hours-row:last-child {
      border-bottom: none;
    }

    .form-box {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin: 0 20px;
      border: 1px solid rgba(0, 212, 255, 0.3);
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #030712;
      color: #fff;
      font-size: 0.9rem;
    }
    .form-submit-btn {
      width: 100%;
      padding: 13px;
      background: #25d366;
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.98rem;
    }

    .social-section {
      text-align: center;
      padding: 30px 20px 10px;
      margin-top: 25px;
      border-top: 1px solid var(--card-border);
    }
    .social-icons-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 16px;
    }
    .social-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #0f172a;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .social-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
    .btn-wa { color: #25d366; }
    .btn-call { color: #00d4ff; }
    .btn-insta { color: #e1306c; }
    .btn-yt { color: #ff0000; }
    .btn-fb { color: #1877f2; }
    .btn-mail { color: #ea4335; }
