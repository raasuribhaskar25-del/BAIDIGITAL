<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAIDIGITAL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
        }
        .lang-selector {
            margin: 15px 0;
        }
        .lang-selector select {
            padding: 5px 10px;
            font-size: 16px;
        }
        .content {
            padding: 50px 20px;
        }
        footer {
            margin-top: 50px;
            padding: 20px;
            background-color: #333;
            color: white;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="main-title">Welcome to BAIDIGITAL</h1>
        
        <!-- భాషలను మార్చుకోవడానికి (Language Selector) డ్రాప్‌డౌన్ -->
        <div class="lang-selector">
            <label for="language" style="color: white; font-weight: bold;">Language / भाषा / ಭಾಷೆ: </label>
            <select id="language" onchange="changeLanguage()">
                <option value="en">English</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="kn">ಕನ್ನಡ (Kannada)</option>
            </select>
        </div>
    </header>

    <div class="content">
        <h2 id="sub-title">Your Digital Growth Partner</h2>
        <p id="desc">We provide the best digital solutions for your business.</p>
        
        <h3>Contact Us</h3>
        <p>Email: <a href="mailto:connect@baidigital.in">connect@baidigital.in</a></p>
    </div>

    <footer>
        <p>&copy; 2026 BAIDIGITAL. All rights reserved.</p>
    </footer>

    <!-- భాషలను మార్చడానికి చిన్న జావాస్క్రిప్ట్ కోడ్ -->
    <script>
        function changeLanguage() {
            const lang = document.getElementById("language").value;
            const mainTitle = document.getElementById("main-title");
            const subTitle = document.getElementById("sub-title");
            const desc = document.getElementById("desc");

            if (lang === "hi") {
                mainTitle.innerText = "BAIDIGITAL में आपका स्वागत है";
                subTitle.innerText = "आपका डिजिटल ग्रोथ पार्टनर";
                desc.innerText = "हम आपके व्यवसाय के लिए सर्वोत्तम डिजिटल समाधान प्रदान करते हैं।";
            } else if (lang === "kn") {
                mainTitle.innerText = "BAIDIGITAL ಗೆ ಸ್ವಾಗತ";
                subTitle.innerText = "ನಿಮ್ಮ ಡಿಜಿಟಲ್ ಬೆಳವಣಿಗೆಯ ಪಾಲುದಾರ";
                desc.innerText = "ನಾವು ನಿಮ್ಮ ವ್ಯಾಪಾರಕ್ಕಾಗಿ ಅತ್ಯುತ್ತಮ ಡಿಜಿಟಲ್ ಪರಿಹಾರಗಳನ್ನು ಒದಗಿಸುತ್ತೇವೆ.";
            } else {
                mainTitle.innerText = "Welcome to BAIDIGITAL";
                subTitle.innerText = "Your Digital Growth Partner";
                desc.innerText = "We provide the best digital solutions for your business.";
            }
        }
    </script>

</body>
</html>
